# NanoLink Agent Configuration Example
# Place this file at /etc/nanolink/nanolink.yaml

# Agent settings
agent:
  # Override hostname (optional, defaults to system hostname)
  # hostname: my-server

  # Heartbeat interval in seconds
  heartbeat_interval: 30

  # Reconnect delay in seconds (uses exponential backoff)
  reconnect_delay: 5
  max_reconnect_delay: 300

# Server connections (gRPC only)
servers:
  - host: localhost      # Server hostname or IP
    port: 39100          # gRPC port (default: 39100)
    token: your_token_here
    permission: 0        # 0=READ_ONLY, 1=BASIC_WRITE, 2=SERVICE_CONTROL, 3=SYSTEM_ADMIN
    tls_enabled: true    # Production default: encrypted gRPC (grpcs://)
    tls_verify: true     # Required when TLS is enabled; false is rejected
    # Private/internal PKI: add the issuing CA without disabling verification.
    # tls_ca_cert: /etc/nanolink/tls/ca.crt
    # Override SNI/hostname verification when host is a tunnel endpoint such as
    # 127.0.0.1. This must match a DNS/IP SAN in the server certificate.
    # tls_server_name: monitor.example.com
    # Optional mutual TLS identity. Configure both files; keep the key mode 0600.
    # tls_client_cert: /etc/nanolink/tls/agent.crt
    # tls_client_key: /etc/nanolink/tls/agent.key

# Agent self-update is fail-closed: applying a binary requires an Ed25519
# signature verified by a pinned release key. Leave auto-apply disabled unless
# your release pipeline publishes detached signatures.
update:
  auto_check: false
  auto_download: false
  auto_apply: false
  require_signature: true
  # public_key: "<32-byte Ed25519 public key, hex or base64>"

# Metrics collection settings
collector:
  # Realtime metrics interval (CPU/Memory/IO) in milliseconds
  # Default: 5000 (5 seconds) - balance between responsiveness and resource usage
  realtime_interval_ms: 5000

  # Disk space usage interval in milliseconds
  disk_usage_interval_ms: 30000   # 30 seconds

  # User sessions check interval
  session_interval_ms: 60000      # 1 minute

  # IP address check interval
  ip_check_interval_ms: 60000     # 1 minute

  # S.M.A.R.T health check interval
  health_check_interval_ms: 300000  # 5 minutes

  # Feature flags
  enable_disk_io: true
  enable_network: true
  enable_per_core_cpu: true
  enable_layered_metrics: true   # Separate realtime/periodic/static data

# Ring buffer settings (for offline data caching)
buffer:
  # Number of metrics to cache when disconnected
  # At 5-second interval: 720 = 1 hour of data
  capacity: 720

# Shell command execution (DANGEROUS - disabled by default)
shell:
  enabled: false
  # super_token: your_super_secret_token
  timeout_seconds: 30
  # Enables the built-in, parsed read-only diagnostic profile. This permits
  # common commands and safe filter pipelines; it never enables arbitrary sh.
  readonly_profile: false
  allowed_working_directories:
    - /
    - /var/log
  whitelist: []
  blacklist:
    - "rm -rf"
    - "mkfs"
    - "> /dev"
    - "dd if="

# Application deployment (requires permission level 3).
# Keep disabled until the writable roots below are also allowed by the
# nanolink-agent systemd sandbox.
deployments:
  enabled: false
  allowed_roots:
    - /opt/nanolink/apps
    - /var/www/nanolink
  max_artifact_size: 536870912 # 512 MiB
  timeout_seconds: 600

# Automated packaging runner (requires permission level 3). Container mode is
# recommended; host mode remains disabled unless explicitly allowed.
builds:
  enabled: false
  workspace_root: /var/lib/nanolink/builds
  allow_host_runner: false
  allowed_images:
    - node:22-alpine
    - maven:3.9-eclipse-temurin-21
    - golang:1.24-alpine
  max_source_size: 536870912
  max_artifact_size: 536870912
  timeout_seconds: 1800
  max_output_size: 2097152

# Logging settings
logging:
  level: info          # debug, info, warn, error
  # file: /var/log/nanolink-agent.log
  audit_enabled: true
  audit_file: /var/log/nanolink-audit.log
  # SYSTEM_LOGS may only read these exact files or directory descendants.
  allowed_paths:
    - /var/log/messages
    - /var/log/syslog
    - /var/log/nginx

# Generic file browser and transfer policy. Uploads fail closed when
# allowed_paths is empty, and completed uploads are committed atomically.
security:
  allowed_paths: []
  max_file_size: 52428800 # 50 MiB

# Management API (localhost only)
management:
  enabled: true
  port: 9101
  # api_token: optional_api_token
