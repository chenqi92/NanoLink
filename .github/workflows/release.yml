name: Release Agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      skip_tests:
        description: "Skip tests (already run by caller)"
        type: boolean
        default: false
      version:
        description: "Version to release (e.g., 0.2.8)"
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Get version info
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: version
        run: |
          # 优先使用 inputs.version（来自 workflow_dispatch 或 workflow_call）
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          # 其次从 tag 提取
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          # 最后从 VERSION 文件读取
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION, Tag: $TAG"


  build-agent:
    name: Build Agent (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - use musl for static linking (maximum compatibility)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-aarch64
            cross: true
          # macOS - native builds
          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: macos-x86_64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-aarch64
            cross: false
          # Windows - native build
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
            cross: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      # Install zig and cargo-zigbuild for Linux musl static builds
      - name: Install Zig (Linux)
        if: matrix.cross == true
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.11.0

      - name: Install cargo-zigbuild (Linux)
        if: matrix.cross == true
        # Pin + --locked: use cargo-zigbuild's own lockfile so a newer transitive
        # dep (e.g. cargo-platform 0.3.3, MSRV 1.91) can't break install on Rust 1.88.
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      # Build with zigbuild for musl targets (static linking)
      - name: Build Agent (Linux musl)
        if: matrix.cross == true
        working-directory: agent
        run: cargo zigbuild --release --target ${{ matrix.target }}

      # Native build for macOS/Windows
      - name: Build Agent (Native)
        if: matrix.cross != true
        working-directory: agent
        run: cargo build --release --target ${{ matrix.target }}


      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp agent/target/${{ matrix.target }}/release/nanolink-agent dist/nanolink-agent-${{ matrix.name }}
          chmod +x dist/nanolink-agent-${{ matrix.name }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy agent\target\${{ matrix.target }}\release\nanolink-agent.exe dist\nanolink-agent-${{ matrix.name }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-${{ matrix.name }}
          path: dist/

  build-dashboard:
    name: Build Dashboard
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/server/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/server/web
        run: npm ci

      - name: Build
        working-directory: apps/server/web
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard
          path: apps/server/web/dist/

  build-nas-packages:
    name: Build NAS Packages
    needs: [prepare, build-agent]
    # 其他桌面平台失败时仍尝试使用已成功产出的两个 Linux 二进制打 NAS 包。
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux Agent binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agent-linux-*
          path: nas-input
          merge-multiple: true

      - name: Install official NAS packaging tools
        run: |
          mkdir -p nas-tools
          curl --fail --location --retry 3 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64 \
            --output nas-tools/fnpack
          curl --fail --location --retry 3 \
            https://osswaf.ugnas.com/pro/ugcli/download/ugcli-v1.1.0.13-linux-amd64 \
            --output nas-tools/ugcli
          echo "72d2a4095da676b64510b023731a227b369d80f8079bc45ff8a2f802ec0480c1  nas-tools/fnpack" | sha256sum --check
          echo "c455dd38def630db2566ae32d0850230ee89abbc948bd1df4819364e88b77713  nas-tools/ugcli" | sha256sum --check
          chmod +x nas-tools/fnpack nas-tools/ugcli
          echo "$PWD/nas-tools" >> "$GITHUB_PATH"

      - name: Verify NAS package sources and tools
        run: |
          ./agent/nas/validate.sh
          fnpack build --help >/dev/null
          ugcli --version

      - name: Build fnOS, Synology and UGOS Pro packages
        run: |
          chmod +x nas-input/nanolink-agent-linux-x86_64 nas-input/nanolink-agent-linux-aarch64
          ./agent/nas/build-all.sh \
            nas-input/nanolink-agent-linux-x86_64 \
            nas-input/nanolink-agent-linux-aarch64 \
            "${GITHUB_RUN_NUMBER}" \
            nas-dist

      - name: Upload NAS packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nas-packages
          path: nas-dist/
          if-no-files-found: error

  release:
    name: Create Release
    needs: [prepare, build-agent, build-dashboard, build-nas-packages]
    # 桌面端或 Dashboard 可部分缺失，但 NAS 原生安装包必须完整生成。
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build-nas-packages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          
          # Copy agent binaries (skip if none exist)
          if ls artifacts/agent-* 1>/dev/null 2>&1; then
            for dir in artifacts/agent-*; do
              cp "$dir"/* release/ 2>/dev/null || true
            done
            echo "✅ Agent binaries copied"
          else
            echo "⚠️ No agent artifacts found"
          fi

          # Copy native NAS packages (skip if none exist)
          if [ -d "artifacts/nas-packages" ]; then
            cp artifacts/nas-packages/* release/
            echo "✅ NAS packages copied"
          else
            echo "⚠️ NAS package artifacts not found"
          fi
          
          # Create dashboard archive (skip if not available)
          if [ -d "artifacts/dashboard" ]; then
            cd artifacts/dashboard
            tar -czvf ../../release/nanolink-dashboard-${{ needs.prepare.outputs.version }}.tar.gz .
            cd ../..
            echo "✅ Dashboard archive created"
          else
            echo "⚠️ Dashboard artifacts not found, skipping"
          fi
          
          # List what we have
          echo ""
          echo "📦 Release files:"
          ls -la release/ || echo "No files in release directory"

      - name: Generate checksums
        run: |
          cd release
          if ls * 1>/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
            cat SHA256SUMS.txt
          else
            echo "No files to checksum"
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Agent Section in Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          
          # Get current release notes
          CURRENT_NOTES=$(gh release view "$TAG" --json body -q .body --repo ${{ github.repository }} 2>/dev/null || echo "")
          
          if [ -z "$CURRENT_NOTES" ]; then
            echo "⚠️ No existing release notes found, skipping update"
            exit 0
          fi
          
          # Build Agent section content
          AGENT_SECTION="### 🔧 Agent

          | Platform | Architecture | Download |
          |----------|--------------|----------|"
          
          # Get agent files from release
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' --repo ${{ github.repository }} 2>/dev/null | grep "nanolink-agent-" || true)
          
          if [ -n "$ASSETS" ]; then
            for filename in $ASSETS; do
              url="https://github.com/${{ github.repository }}/releases/download/${TAG}/${filename}"
              case "$filename" in
                *linux-x86_64*) AGENT_SECTION="$AGENT_SECTION
          | Linux | x86_64 | [${filename}](${url}) |" ;;
                *linux-aarch64*) AGENT_SECTION="$AGENT_SECTION
          | Linux | ARM64 | [${filename}](${url}) |" ;;
                *macos-x86_64*) AGENT_SECTION="$AGENT_SECTION
          | macOS | x86_64 | [${filename}](${url}) |" ;;
                *macos-aarch64*) AGENT_SECTION="$AGENT_SECTION
          | macOS | ARM64 (M1/M2) | [${filename}](${url}) |" ;;
                *windows*.exe) AGENT_SECTION="$AGENT_SECTION
          | Windows | x86_64 | [${filename}](${url}) |" ;;
              esac
            done
          else
            AGENT_SECTION="$AGENT_SECTION
          | - | - | ⏳ 构建中... |"
          fi
          
          # Replace section in notes using awk
          echo "$CURRENT_NOTES" | awk -v section="$AGENT_SECTION" '
            /<!-- AGENT_SECTION_START -->/ { print; print section; skip=1; next }
            /<!-- AGENT_SECTION_END -->/ { skip=0 }
            !skip { print }
          ' > updated-notes.md
          
          # Update release
          gh release edit "$TAG" --notes-file updated-notes.md --repo ${{ github.repository }}
          echo "✅ Agent section updated in release notes"
