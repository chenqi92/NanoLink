name: Security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apps/server, sdk/go, demo/go-gin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...
        working-directory: ${{ matrix.module }}

  web-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/server/web/package-lock.json
      - run: npm ci
        working-directory: apps/server/web
      - run: npm audit --audit-level=high
        working-directory: apps/server/web

  rust-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: agent

  python-vulnerabilities:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [sdk/python, demo/python-fastapi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install pip-audit
      - name: Audit Python dependencies
        shell: bash
        run: |
          if [[ -f requirements.txt ]]; then
            pip-audit -r requirements.txt
          else
            pip-audit .
          fi
        working-directory: ${{ matrix.project }}
