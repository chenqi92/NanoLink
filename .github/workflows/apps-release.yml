name: Apps Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 0.1.0)"
        required: true
        default: "0.1.0"
  workflow_call:
    inputs:
      skip_tests:
        description: "Skip tests (already run by caller)"
        type: boolean
        default: false
      version:
        description: "Version to release (e.g., 0.2.8)"
        type: string
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nanolink-server

permissions:
  contents: read

jobs:
  # Build and push Docker image for Linux
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write


    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          # 优先使用 inputs.version（来自 workflow_dispatch 或 workflow_call）
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          # 其次从 tag 提取
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          # 最后从 VERSION 文件读取
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Build and push to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          context: .
          file: ./apps/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nanolink-server:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nanolink-server:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha

  # Build native Android APK
  mobile-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build and package APK
        working-directory: apps/android
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(cat ../../VERSION | tr -d '[:space:]')
          fi
          ./gradlew assembleRelease -PversionName="$VERSION"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/NanoLink-Android-$VERSION.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nanolink-android
          path: apps/android/release/*.apk

  # Build native Mac Catalyst application
  desktop-macos:
    name: Build Native macOS App
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Mac Catalyst app (no codesign)
        run: |
          xcodebuild \
            -project apps/ios/NanoLink.xcodeproj \
            -scheme NanoLink \
            -configuration Release \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            -derivedDataPath apps/ios/build-macos \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package macOS app
        run: |
          APP_PATH="apps/ios/build-macos/Build/Products/Release-maccatalyst/NanoLink.app"
          test -d "$APP_PATH"
          mkdir -p apps/ios/release
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" \
            "apps/ios/release/NanoLink-macOS-${{ steps.version.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nanolink-macos
          path: apps/ios/release/*-macOS-*.zip

  # Build native iOS IPA (unsigned for sideload)
  mobile-ios:
    name: Build Native iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build native iOS app (no codesign)
        run: |
          xcodebuild \
            -project apps/ios/NanoLink.xcodeproj \
            -scheme NanoLink \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath apps/ios/build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create unsigned IPA
        run: |
          APP_PATH="apps/ios/build/Build/Products/Release-iphoneos/NanoLink.app"
          test -d "$APP_PATH"
          mkdir -p apps/ios/release apps/ios/Payload
          cp -R "$APP_PATH" apps/ios/Payload/
          cd apps/ios
          zip -r "release/NanoLink-iOS-${{ steps.version.outputs.version }}-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nanolink-ios
          path: apps/ios/release/*.ipa

  # Create release with all artifacts
  release:
    name: Create Release
    needs: [docker, desktop-macos, mobile-android, mobile-ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nanolink-macos
          path: release/macos
        continue-on-error: true

      - name: Download Android artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nanolink-android
          path: release/android
        continue-on-error: true

      - name: Download iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nanolink-ios
          path: release/ios
        continue-on-error: true

      - name: Extract version
        id: version
        run: |
          # 优先使用 inputs.version（来自 workflow_dispatch 或 workflow_call）
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            release/macos/*
            release/android/*
            release/ios/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Apps Section in Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          
          # Get current release notes
          CURRENT_NOTES=$(gh release view "$TAG" --json body -q .body --repo ${{ github.repository }} 2>/dev/null || echo "")
          
          if [ -z "$CURRENT_NOTES" ]; then
            echo "⚠️ No existing release notes found, skipping update"
            exit 0
          fi
          
          # Build Apps section content
          APPS_SECTION="### Native Apps

          | Platform | Download |
          |----------|----------|"
          
          # Get app files from release
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' --repo ${{ github.repository }} 2>/dev/null || true)
          
          APP_COUNT=0
          for filename in $(echo "$ASSETS" | grep -E "NanoLink-.*(zip|dmg|tar.gz|apk|ipa)$" || true); do
            APP_COUNT=$((APP_COUNT + 1))
            url="https://github.com/${{ github.repository }}/releases/download/${TAG}/${filename}"
            case "$filename" in
              *macOS*) APPS_SECTION="${APPS_SECTION}
          | macOS | [${filename}](${url}) |" ;;
              *.apk) APPS_SECTION="${APPS_SECTION}
          | Android | [${filename}](${url}) |" ;;
              *.ipa) APPS_SECTION="${APPS_SECTION}
          | iOS | [${filename}](${url}) |" ;;
            esac
          done
          
          [ $APP_COUNT -eq 0 ] && APPS_SECTION="${APPS_SECTION}
          | - | ⏳ 构建中... |"
          
          # Add Docker section
          APPS_SECTION="${APPS_SECTION}

          ### 🐳 Docker

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository_owner }}/nanolink-server:${VERSION}
          docker pull ghcr.io/${{ github.repository_owner }}/nanolink-server:latest
          \`\`\`"
          
          # Replace section in notes using awk
          echo "$CURRENT_NOTES" | awk -v section="$APPS_SECTION" '
            /<!-- APPS_SECTION_START -->/ { print; print section; skip=1; next }
            /<!-- APPS_SECTION_END -->/ { skip=0 }
            !skip { print }
          ' > updated-notes.md
          
          # Update release
          gh release edit "$TAG" --notes-file updated-notes.md --repo ${{ github.repository }}
          echo "✅ Apps section updated in release notes"
