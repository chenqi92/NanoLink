services:
  nanolink-server:
    build:
      context: ../..
      dockerfile: apps/docker/Dockerfile
    image: ghcr.io/chenqi92/nanolink-server:latest
    container_name: nanolink-server
    restart: unless-stopped
    # Loopback-only by default. Set NANOLINK_BIND_ADDRESS=0.0.0.0 only when a
    # firewall or TLS reverse proxy protects these ports.
    ports:
      - "${NANOLINK_BIND_ADDRESS:-127.0.0.1}:8080:8080"   # HTTP API & Dashboard
      - "${NANOLINK_BIND_ADDRESS:-127.0.0.1}:9100:9100"   # WebSocket for legacy agents
      - "${NANOLINK_BIND_ADDRESS:-127.0.0.1}:39100:39100" # gRPC for agents
    volumes:
      - nanolink-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      # Uncomment after creating ./tls and configuring the TLS environment
      # variables below. Private keys must remain outside the image.
      # - ./tls:/app/tls:ro
    environment:
      - TZ=Asia/Shanghai
      - NANOLINK_SERVER_MODE=release
      # Native TLS and optional Agent mutual TLS:
      # - NANOLINK_TLS_CERT=/app/tls/server.crt
      # - NANOLINK_TLS_KEY=/app/tls/server.key
      # - NANOLINK_GRPC_CLIENT_CA=/app/tls/agent-ca.crt
      # Required secrets: Compose refuses to start until the operator supplies
      # non-placeholder values (for example via a local, uncommitted .env file).
      - "NANOLINK_ADMIN_USERNAME=${NANOLINK_ADMIN_USERNAME:?Set NANOLINK_ADMIN_USERNAME}"
      - "NANOLINK_ADMIN_PASSWORD=${NANOLINK_ADMIN_PASSWORD:?Set a strong NANOLINK_ADMIN_PASSWORD}"
      - "NANOLINK_JWT_SECRET=${NANOLINK_JWT_SECRET:?Set a random 32-byte-or-longer NANOLINK_JWT_SECRET}"
      - NANOLINK_JWT_EXPIRE_HOUR=24
      # Database configuration (SQLite by default)
      - NANOLINK_DATABASE_TYPE=sqlite
      - NANOLINK_DATABASE_PATH=/app/data/nanolink.db
      # Required for remote application deployment artifact downloads.
      # Example: https://nanolink.example.com
      - NANOLINK_EXTERNAL_URL=${NANOLINK_EXTERNAL_URL:-}
      - NANOLINK_DEPLOYMENT_STORAGE_PATH=/app/data/artifacts
      - NANOLINK_BUILD_STORAGE_PATH=/app/data/builds
      # Comma-separated exact hostnames allowed to serve source archives from
      # private IPs. Leave empty to enforce public-address-only URL pulls.
      - NANOLINK_BUILD_ALLOWED_SOURCE_HOSTS=${NANOLINK_BUILD_ALLOWED_SOURCE_HOSTS:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  nanolink-data:
    driver: local
