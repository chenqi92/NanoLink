# Spring Boot Application Configuration
spring:
  application:
    name: nanolink-demo

# Server Configuration
server:
  address: ${NANOLINK_HTTP_BIND_ADDRESS:127.0.0.1}
  port: 8080

# NanoLink Configuration
nanolink:
  api:
    token: ${NANOLINK_API_TOKEN}
  server:
    # gRPC port for agent connections
    grpc-port: 39100
    # Required: use the same high-entropy token configured on the agent.
    token: ${NANOLINK_AGENT_TOKEN}

# Logging Configuration
logging:
  level:
    root: INFO
    com.kkape: DEBUG
    com.kkape.demo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
